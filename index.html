<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Landing Page - Trần Anh Huy - 23110229</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="hero"></div>
    <div id="features"></div>
    <div id="pricing"></div>
    <div id="contact"></div>
    <h2>hello Nguyễn QUỐC ĐẠT- haha</h2>
    <h1>Trần Anh Huy</h1>
    <script>
        function loadSection(id, file) {
            fetch(file)
                .then(res => res.text())
                .then(html => {
                    document.getElementById(id).innerHTML = html;
                });
        }
        loadSection("hero", "sections/hero.html");
        loadSection("features", "sections/features.html");
        loadSection("pricing", "sections/pricing.html");
        loadSection("contact", "sections/contact.html");
    </script>
</body>

</html>
